<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emberlo</title>
<style>
:root { --bg: #fbf7f2; --text: #2b211b; --muted: #75655a; --ember: #c2410c; --rule: #eaded2; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #17120f; --text: #f1e9e1; --muted: #b3a294; --ember: #fb923c; --rule: #3a2e26; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
main { max-width: 680px; margin: 0 auto; padding: 32px 16px 64px; }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
header a { color: var(--text); text-decoration: none; font-weight: 600; }
.flame { color: var(--ember); font-size: 22px; }
nav { margin-left: auto; display: flex; gap: 16px; font-size: 15px; }
nav a { color: var(--muted); font-weight: 500; }
nav a[aria-current] { color: var(--ember); }
h1 { font-size: 32px; line-height: 1.2; margin: 24px 0 8px; }
h2 { font-size: 20px; margin: 36px 0 8px; padding-top: 20px; border-top: 1px solid var(--rule); }
h3 { font-size: 17px; margin: 24px 0 4px; }
p, li { overflow-wrap: anywhere; }
p { margin: 0 0 12px; }
ul, ol { padding-left: 22px; margin: 0 0 12px; }
.meta { color: var(--muted); font-size: 15px; }
a { color: var(--ember); }
footer { margin-top: 48px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
<header><span class="flame" aria-hidden="true">&#x1F525;&#xFE0E;</span><a href="">Emberlo</a><nav><a href="support/">Support</a><a href="privacy/">Privacy Policy</a></nav></header>
<h1>Emberlo</h1>
<p>Music and audiobooks from your own Plex, Jellyfin, Emby and Audiobookshelf servers, on iPhone and iPad.</p>
<ul><li><a href="support/">Support</a></li><li><a href="privacy/">Privacy Policy</a></li></ul>
<footer>&copy; 2026 Marat Oganesyan</footer>
</main>
</body>
</html>
